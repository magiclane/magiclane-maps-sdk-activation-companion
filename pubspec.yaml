name: activation_companion
description: "Companion app for the offline activation of the Magic Lane Maps SDK."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
